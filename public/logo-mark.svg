<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" fill="none">
  <!-- DealMatch — monogram D•M. Biru #1E3A8A, hijau #10B981. -->
  <!-- Huruf D: bentuk luar dikurangi rongga dalam (fill-rule evenodd). -->
  <path
    fill="#1E3A8A"
    fill-rule="evenodd"
    d="M4 6h15a26 26 0 0 1 0 52H4V6Zm13 11v30h2a15 15 0 0 0 0-30h-2Z"
  />
  <!-- Simpul di rongga D + garis penghubung ke M (motif "connecting"). -->
  <circle cx="27" cy="32" r="5.5" fill="#1E3A8A" />
  <path d="M27 32h23" stroke="#10B981" stroke-width="5.5" stroke-linecap="round" />
  <circle cx="50" cy="32" r="5.5" fill="#10B981" />
  <!-- Huruf M: dua kaki + puncak. -->
  <path
    d="M64 57V25l11 14 11-14v32"
    stroke="#10B981"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
